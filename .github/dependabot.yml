# Dependabot：依赖更新 + GitHub Actions 版本更新
# 每 Monday 09:00（UTC+8）各检查一轮；安全补丁不受此限制（GitHub 默认即时开 PR）

version: 2

updates:
  # npm 生产/开发依赖
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '01:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      # 补丁版本打包成一个 PR，减少噪音
      patch-updates:
        update-types: ['patch']
    ignore:
      # wechaty 主版本升级常带协议行为变化，需人工评估
      - dependency-name: wechaty
        update-types: ['version-update:semver-major']

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '01:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
